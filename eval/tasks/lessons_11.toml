id = "lessons_11"
area = "lessons"
deps = []
prompt = '''
Write a fixed-capacity pool: `SlotPool(n)` holds `n` slots of `Int` values; `alloc!(p, v)` stores `v` in a free slot and returns its index (or throws `ArgumentError` when the pool is full); `free!(p, i)` releases slot `i`; `p[i]` reads slot `i`. Both `alloc!` and `free!` must take constant time regardless of how many slots are in use.

Reply with a single ```julia code block containing the complete code.
'''
check = '''
p = SlotPool(4)
i = alloc!(p, 10); j = alloc!(p, 20)
@test i != j && p[i] == 10 && p[j] == 20
free!(p, i)
k = alloc!(p, 30)
@test p[k] == 30 && p[j] == 20
alloc!(p, 1); alloc!(p, 2)
@test_throws ArgumentError alloc!(p, 3)
function churn(n)
    p = SlotPool(n)
    idx = [alloc!(p, i) for i in 1:n]
    for r in 1:3
        for i in idx
            free!(p, i)
        end
        for i in 1:n
            idx[i] = alloc!(p, i)
        end
    end
    return p[idx[n]]
end
churn(100)
t = minimum(@elapsed(churn(100_000)) for _ in 1:3)
@test churn(1000) == 1000
@test t < 0.05
'''
reference = '''
struct SlotPool
    vals::Vector{Int}
    free::Vector{Int}
end
SlotPool(n) = SlotPool(zeros(Int, n), collect(n:-1:1))

function alloc!(p::SlotPool, v)
    isempty(p.free) && throw(ArgumentError("pool is full"))
    i = pop!(p.free)
    p.vals[i] = v
    return i
end
free!(p::SlotPool, i) = (push!(p.free, i); nothing)
Base.getindex(p::SlotPool, i) = p.vals[i]
'''
negative = '''
struct SlotPool
    vals::Vector{Int}
    used::Vector{Bool}
end
SlotPool(n) = SlotPool(zeros(Int, n), fill(false, n))

function alloc!(p::SlotPool, v)
    i = findfirst(!, p.used)
    i === nothing && throw(ArgumentError("pool is full"))
    p.used[i] = true
    p.vals[i] = v
    return i
end
free!(p::SlotPool, i) = (p.used[i] = false; nothing)
Base.getindex(p::SlotPool, i) = p.vals[i]
'''
