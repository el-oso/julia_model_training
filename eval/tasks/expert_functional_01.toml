function prefix_sums(A::AbstractVector)
    out = similar(A, typeof(zero(eltype(A)) + zero(eltype(A))))
    s = zero(eltype(out))
    for i in eachindex(A, out)
        s += A[i]
        out[i] = s
    end
    return out
end
