'''
reference = '''
const MEMO = Dict{Int,Int}()

function fib(n::Int)
    n <= 2 && return 1
    v = get(MEMO, n, 0)
    v != 0 && return v
    r = fib(n - 1) + fib(n - 2)
    MEMO[n] = r
    return r
end
