prompt = '''
This memoized Fibonacci keeps its cache in an untyped non-constant global, so `fib` infers as `Any`. Fix it so that `fib(::Int)` has inferred return type `Int` and the cache is a concretely typed `Dict{Int,Int}`. Do not mutate the dictionary inside a `get!` callback that recurses.

```julia
memo = Dict()

function fib(n)
    n <= 2 && return 1
    haskey(memo, n) && return memo[n]
    memo[n] = fib(n - 1) + fib(n - 2)
end
```

Reply with a single ```julia code block containing the complete code.
'''
