deps = []
prompt = '''
`addtuples` adds two 3-tuples elementwise but goes through a heap-allocated vector. Rewrite it so it returns a concretely typed `NTuple{3,Float64}` and allocates nothing.

```julia
addtuples(a::NTuple{3,Float64}, b::NTuple{3,Float64}) = Tuple([x + y for (x, y) in zip(a, b)])
```

Reply with a single ```julia code block containing the complete code.
'''
check = '''
a = (1.0, 2.0, 3.0); b = (0.5, 0.5, 0.5)
@test addtuples(a, b) === (1.5, 2.5, 3.5)
@test rtype(addtuples, (NTuple{3,Float64}, NTuple{3,Float64})) === NTuple{3,Float64}
@test alloc_of(addtuples, a, b) == 0
'''
reference = '''
addtuples(a::NTuple{3,Float64}, b::NTuple{3,Float64}) = map(+, a, b)
'''
negative = '''
addtuples(a::NTuple{3,Float64}, b::NTuple{3,Float64}) = Tuple([x + y for (x, y) in zip(a, b)])
'''
