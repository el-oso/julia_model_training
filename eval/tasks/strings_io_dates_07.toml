id = "strings_io_dates_07"
area = "strings_io_dates"
deps = []
prompt = '''
Write `format_money(x::Real)::String` that formats a number with exactly two decimals and comma thousands separators: `0` gives `"0.00"`, `1234.5` gives `"1,234.50"`, `-1234567.891` gives `"-1,234,567.89"`, `999.999` gives `"1,000.00"`, and `1000000` (an `Int`) gives `"1,000,000.00"`. Do not rely on a locale.

Reply with a single ```julia code block containing the complete code.
'''
check = '''
@test format_money(0) == "0.00"
@test format_money(1234.5) == "1,234.50"
@test format_money(-1234567.891) == "-1,234,567.89"
@test format_money(999.999) == "1,000.00"
@test format_money(1000000) == "1,000,000.00"
@test format_money(12.0) == "12.00"
@test format_money(-0.5) == "-0.50"
@test format_money(123456.0f0) == "123,456.00"
@test format_money(100) isa String
'''
reference = '''
using Printf
function format_money(x::Real)
    s = @sprintf("%.2f", abs(x))
    int, frac = split(s, '.')
    groups = String[]
    i = lastindex(int)
    while i >= firstindex(int)
        j = max(firstindex(int), i - 2)
        pushfirst!(groups, int[j:i])
        i = j - 1
    end
    out = join(groups, ',') * "." * frac
    return (x < 0 && out != "0.00") ? "-" * out : out
end
'''
negative = '''
format_money(x::Real) = string(round(x; digits = 2))
'''
