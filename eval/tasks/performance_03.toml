id = "performance_03"
area = "performance"
deps = []
prompt = '''
`rowsums` computes the sum of each row of a matrix, but it walks memory in the wrong order for Julia arrays. Rewrite it so it is much faster on large matrices while returning the same values. It must still work for any `AbstractMatrix` (views included) and for `Float32` input (result eltype `Float32`).

```julia
function rowsums(A)
    out = zeros(eltype(A), size(A, 1))
    for i in 1:size(A, 1)
        for j in 1:size(A, 2)
            out[i] += A[i, j]
        end
    end
    return out
end
```

Reply with a single ```julia code block containing the complete code.
'''
check = '''
function naive(A)
    out = zeros(eltype(A), size(A, 1))
    for i in 1:size(A, 1)
        for j in 1:size(A, 2)
            out[i] += A[i, j]
        end
    end
    return out
end
A = rand(5000, 5000)
@test rowsums(A[1:50, 1:50]) ≈ vec(sum(A[1:50, 1:50]; dims = 2))
@test rowsums(view(A, 1:7, 1:9)) ≈ vec(sum(view(A, 1:7, 1:9); dims = 2))
@test eltype(rowsums(rand(Float32, 4, 4))) === Float32
rowsums(A); naive(A)
t_sol = minimum(@elapsed(rowsums(A)) for _ in 1:3)
t_naive = minimum(@elapsed(naive(A)) for _ in 1:3)
@test t_sol < t_naive / 2
'''
reference = '''
function rowsums(A)
    out = zeros(eltype(A), size(A, 1))
    for j in axes(A, 2)
        for i in axes(A, 1)
            out[i] += A[i, j]
        end
    end
    return out
end
