id = "linalg_sparse_01"
area = "linalg_sparse"
deps = ["OffsetArrays"]
prompt = '''
`normalize_cols` hard-codes `Float64` and 1-based axes. Rewrite it for any `AbstractMatrix`: each column scaled to unit 2-norm; the result has the float version of the input element type (`Float32` stays `Float32`, `BigFloat` works, `Int` gives `Float64`) and the same axes as the input (so an `OffsetArray` or a `view` works).

```julia
using LinearAlgebra
function normalize_cols(A)
    out = zeros(size(A))
    for j in 1:size(A, 2)
        out[:, j] = A[:, j] / norm(A[:, j])
    end
    return out
end
```

Reply with a single ```julia code block containing the complete code.
'''
check = '''
using LinearAlgebra
A = rand(4, 3)
N = normalize_cols(A)
@test all(norm(N[:, j]) ≈ 1 for j in 1:3)
@test normalize_cols(rand(Float32, 3, 2)) isa Matrix{Float32}
@test eltype(normalize_cols(BigFloat.(A))) === BigFloat
@test eltype(normalize_cols([1 2; 3 4])) === Float64
V = view(A, 1:3, 2:3)
@test normalize_cols(V) ≈ normalize_cols(A[1:3, 2:3])
O = OffsetArray(A, 0:3, 5:7)
NO = normalize_cols(O)
@test axes(NO) == axes(O)
@test collect(NO) ≈ N
'''
reference = '''
using LinearAlgebra
function normalize_cols(A::AbstractMatrix)
    out = similar(A, float(eltype(A)))
    for j in axes(A, 2)
        c = view(A, :, j)
        out[:, j] .= c ./ norm(c)
    end
    return out
end
