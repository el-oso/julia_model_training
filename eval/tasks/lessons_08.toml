prompt = '''
Write a tiny persistent store: `Store(path)` opens (creating if absent, replaying if present) an append-only log file; `setkey!(s, k::String, v::String)`, `delkey!(s, k)` and `getkey(s, k, default)` work on it. Every change must be appended to the file immediately so that a new `Store(path)` on the same file sees it. Keys and values are arbitrary Unicode strings; a value may be the empty string, which is different from a deleted key.

Reply with a single ```julia code block containing the complete code.
'''
check = '''
