reference = '''
mutable struct Store
    path::String
    d::Dict{String,String}
end

function Store(path::AbstractString)
    d = Dict{String,String}()
    if isfile(path)
        open(path) do io
            while !eof(io)
                op = read(io, UInt8)
                k = String(read(io, read(io, UInt32)))
                if op == 0x01
                    d[k] = String(read(io, read(io, UInt32)))
                else
                    delete!(d, k)
                end
            end
        end
    end
    return Store(String(path), d)
end

function setkey!(s::Store, k::String, v::String)
    open(s.path, "a") do io
        write(io, 0x01, UInt32(sizeof(k)), k, UInt32(sizeof(v)), v)
    end
    s.d[k] = v
    return s
end

function delkey!(s::Store, k::String)
    open(s.path, "a") do io
        write(io, 0x00, UInt32(sizeof(k)), k)
    end
    delete!(s.d, k)
    return s
end

getkey(s::Store, k::String, default) = get(s.d, k, default)
'''
negative = '''
mutable struct Store
    path::String
    d::Dict{String,String}
end

function Store(path::AbstractString)
    d = Dict{String,String}()
    if isfile(path)
        for line in eachline(path)
            k, v = split(line, '\t'; limit = 2)
            isempty(v) ? delete!(d, k) : (d[k] = v)
        end
    end
    return Store(String(path), d)
end

function setkey!(s::Store, k::String, v::String)
    open(s.path, "a") do io
        println(io, k, '\t', v)
    end
    s.d[k] = v
    return s
end

delkey!(s::Store, k::String) = (setkey!(s, k, ""); delete!(s.d, k); s)

getkey(s::Store, k::String, default) = get(s.d, k, default)
'''
