id = "performance_04"
area = "performance"
deps = ["OffsetArrays"]
prompt = '''
`movavg!` allocates a temporary array for every output element. Rewrite it to perform zero allocations while keeping the same result. It must honor the axes of its arguments: it should work for any `AbstractVector`, including an `OffsetVector`, and throw a `DimensionMismatch` when `out` and `x` have different axes. Only interior points are written (the first and last element of `out` are left untouched).

```julia
function movavg!(out, x)
    for i in 2:length(x)-1
        out[i] = sum(x[i-1:i+1]) / 3
    end
    return out
end
```

Reply with a single ```julia code block containing the complete code.
'''
check = '''
x = rand(1000); out = zeros(1000)
@test movavg!(out, x) === out
@test out[2:end-1] ≈ [(x[i-1] + x[i] + x[i+1]) / 3 for i in 2:999]
@test out[1] == 0 && out[end] == 0
@test alloc_of(movavg!, out, x) == 0
xo = OffsetArray(collect(1.0:6.0), -2:3); oo = OffsetArray(zeros(6), -2:3)
movavg!(oo, xo)
@test axes(oo) == (-2:3,)
@test oo[-1:2] ≈ [2.0, 3.0, 4.0, 5.0]
@test oo[-2] == 0 && oo[3] == 0
@test_throws DimensionMismatch movavg!(zeros(5), zeros(6))
'''
reference = '''
function movavg!(out, x)
    axes(out) == axes(x) || throw(DimensionMismatch("out and x must have the same axes: $(axes(out)) vs $(axes(x))"))
    for i in firstindex(x)+1:lastindex(x)-1
        out[i] = (x[i-1] + x[i] + x[i+1]) / 3
    end
    return out
end
'''
